name: Apply landing-auth patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply the queued UI patch
        run: |
          set -euo pipefail
          cd .github/patches
          if [ ! -f part04 ]; then echo "Patch incomplete; skipping."; exit 0; fi
          cat part0* | base64 -d | gunzip > /tmp/landing-auth.patch
          cd "$GITHUB_WORKSPACE"
          git apply -3 /tmp/landing-auth.patch
          git rm -q .github/patches/part0* .github/workflows/apply-landing-auth.yml
          git config user.name "apex-ui-bot"
          git config user.email "apex-ui-bot@users.noreply.github.com"
          git commit -m "Refactor landing and auth UI: single Google CTA, AA contrast, tighter hero"
          git push
